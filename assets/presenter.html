<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PDF Classroom</title><style>
:root{font-family:Segoe UI,Microsoft YaHei,sans-serif;color:#253150;background:#202838}*{box-sizing:border-box}body{margin:0;height:100dvh;display:flex;flex-direction:column;overflow:hidden}button,select,textarea,input{font:inherit}button,select{border:1px solid #d7dce5;background:#fff;color:#253150;border-radius:8px;padding:8px 11px;min-height:38px;cursor:pointer}button:hover{background:#edf0f6}button:disabled{opacity:.35;cursor:default}button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #d88742;outline-offset:2px}header,footer{background:#f8f9fc;display:flex;gap:8px;align-items:center;padding:10px 18px;flex-wrap:wrap}header{border-bottom:1px solid #d5dae3}header strong{font-size:14px;margin-right:auto}header button,header select{font-size:12px}#page-picker{max-width:270px}#viewport{flex:1;overflow:auto;min-height:0;padding:16px;scroll-behavior:smooth}#paper{position:relative;margin:0 auto;background:#fff;box-shadow:0 9px 35px #0005;container-type:inline-size}#page-image{display:block;width:100%;height:auto}#answers,#marks{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.answer{position:absolute;opacity:0;transition:opacity 210ms ease;pointer-events:none}.answer.visible{opacity:1}.blank-answer{color:#a83f16;font-weight:650;line-height:1.18;display:flex;align-items:flex-end;justify-content:center;white-space:nowrap;background:#fff;overflow:visible}.choice-answer{border:2px solid #bd5d28;border-radius:5px;background:#f5a34f1c}.choice-answer:before{content:'✓';position:absolute;left:-1.3em;top:.15em;color:#a83f16;font-weight:800;font-size:1.2em}footer{justify-content:center;font-size:12px;border-top:1px solid #d5dae3}footer .primary{background:#263451;color:#fff;border-color:#263451}#position{min-width:150px;text-align:center;font-variant-numeric:tabular-nums}#hint{color:#627087;font-size:11px}#ink-tools{display:none;background:#f8f9fc;padding:6px 18px;gap:8px;align-items:center}#ink-tools.active{display:flex}#marks.active{pointer-events:auto;touch-action:none;cursor:crosshair}#save-status{font-size:10px;color:#627087}dialog{border:0;border-radius:12px;padding:20px;width:min(760px,95vw);max-height:90dvh;color:#253150;box-shadow:0 20px 80px #0005}dialog::backdrop{background:#111b2bb3}dialog .bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}dialog h2{font-size:20px;margin:0}textarea{width:100%;height:50vh;resize:vertical;border:1px solid #cdd3de;padding:16px;line-height:1.7}#board{display:block;background:#fff;width:100%;aspect-ratio:3/2;border:1px solid #d7dce5;touch-action:none}#video-frame iframe{width:100%;aspect-ratio:16/9;border:0}.activity-stage{padding:25px;text-align:center;background:#f0f2f7;border-radius:10px;min-height:200px}.activity-stage input{width:90%}.iris{width:150px;height:150px;background:#7a684d;border:12px solid #ece5d7;border-radius:50%;display:grid;place-items:center;margin:20px auto;box-shadow:0 0 0 2px #655644}.pupil{background:#16171b;border-radius:50%;width:60px;height:60px;transition:width .25s,height .25s}.plant{height:150px;width:10px;background:#547649;border-radius:12px;transform-origin:bottom;margin:25px auto;transition:transform 1s}.plant:before{content:'';display:block;width:50px;height:25px;border-radius:100% 0;background:#688753;transform:translateX(-40px)}[hidden]{display:none!important}@media(max-width:700px){header{padding:7px;gap:5px}header strong{width:100%}#page-picker{max-width:46vw}footer{padding:7px;gap:5px}#hint{display:none}#viewport{padding:8px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style><header><strong id="heading">PDF CLASSROOM</strong><span id="save-status"></span><select id="language" aria-label="Language"></select><select id="zoom" aria-label="Page view"><option value="fit">Full page</option><option value="width">Page width</option><option value="150">150%</option></select><button id="mark-toggle">Mark</button><button data-open="notes-dialog">Notes</button><button data-open="board-dialog">Board</button><button id="video-open">Video</button><button id="activity-open">Activity</button><button id="fullscreen">⛶</button><button data-open="settings-dialog">⋯</button></header>
<div id="ink-tools"><input id="ink-color" type="color" value="#b94e24" aria-label="Ink colour"><select id="ink-mode" aria-label="Ink tool"><option value="pen">Pen</option><option value="highlight">Highlighter</option></select><button id="mark-undo">Undo</button><button id="mark-clear">Clear marks</button></div>
<main id="viewport"><div id="paper"><img id="page-image" alt="Student PDF page"><div id="answers"></div><svg id="marks" viewBox="0 0 1000 1415"><g></g></svg></div></main>
<footer><button id="previous-page" aria-label="Previous PDF page">‹ Page</button><select id="page-picker" aria-label="PDF page"></select><button id="next-page" aria-label="Next PDF page">Page ›</button><span id="position" aria-live="polite"></span><button id="hide" title="Left arrow">← Hide</button><button id="reveal" class="primary" title="Space / Right arrow">Reveal →</button><span id="hint">Space / → reveal · ← hide</span></footer>
<dialog id="notes-dialog"><div class="bar"><h2>Notes</h2><button data-close>×</button></div><textarea id="note" aria-label="Notes for this PDF page"></textarea></dialog>
<dialog id="board-dialog"><div class="bar"><h2>Board</h2><button id="board-undo">Undo</button><button id="board-clear">Clear</button><button data-close>×</button></div><svg id="board" viewBox="0 0 1000 667"><g></g></svg></dialog>
<dialog id="video-dialog"><div class="bar"><h2 id="video-title">Video</h2><button data-close>×</button></div><div id="video-frame"></div></dialog>
<dialog id="activity-dialog"><div class="bar"><h2 id="activity-title">Activity</h2><button data-close>×</button></div><div id="activity-content"></div></dialog>
<dialog id="settings-dialog"><div class="bar"><h2>Classroom</h2><button data-close>×</button></div><p id="storage-note">Progress, notes and drawings are saved on this browser.</p><button id="export">Export progress</button><button id="import">Import progress</button><input hidden id="import-file" type="file" accept="application/json"><p id="keyboard-note">Space / →: next answer. ←: hide last answer. Use the page buttons to turn the PDF page.</p></dialog>
<script id="presenter-data" type="application/json">__PRESENTER_DATA__</script><script>__PRESENTER_JS__</script></html>
